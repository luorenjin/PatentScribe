[package]
name = "keygen"
version = "0.1.0"
edition = "2021"

[dependencies]
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "z"      # 优化体积
lto = true           # 链接时优化
codegen-units = 1    # 减少并行以获得更好的优化
panic = "abort"      # 异常时直接中止，减少二进制体积
strip = true         # 剥离符号信息
